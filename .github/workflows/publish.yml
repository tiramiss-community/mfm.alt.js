name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.env.RELEASE_TAG, `v${version}`, 'Release tag must match package.json: v<version>');
          assert.equal(process.env.RELEASE_PRERELEASE, String(version.includes('-')), 'Release prerelease flag must match package.json version');
          NODE
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm tsc
      - run: pnpm lint
      - run: pnpm test
      - name: Publish to npm
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [ "$RELEASE_PRERELEASE" = 'true' ]; then
            npm publish --access public --provenance --tag next
          else
            npm publish --access public --provenance --tag latest
          fi
